[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qasp"
version = "0.1.0"
description = "Quantum Agent Software Package for quantum circuits, optimization, classifiers, kernels, RL policies, and simulation workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "QASP contributors" }
]
license = { text = "MIT" }
keywords = ["quantum computing", "pennylane", "QAOA", "QUBO", "quantum optimization", "quantum classification", "reinforcement learning", "quantum kernels", "policy gradients"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium",
  "matplotlib",
  "numpy",
  "pandas",
  "pennylane",
  "ray[rllib]",
  "scipy",
  "tensordict",
  "torch",
  "torchrl",
]

[project.optional-dependencies]
dev = [
  "ipykernel",
  "pytest",
  "ruff",
  "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/INESCTEC/qasp"
Repository = "https://github.com/andre-sequeira10/iqp-policy-experiments"
Issues = "https://github.com/andre-sequeira10/iqp-policy-experiments/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["qasp", "qasp.*"]
exclude = ["tests", "tests.*", "__MACOSX", "__MACOSX.*"]
